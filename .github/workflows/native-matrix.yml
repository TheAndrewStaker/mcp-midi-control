name: native-matrix

# Cross-platform validation of the native MIDI stack (@julusian/midi +
# serialport). The Windows path is covered by preflight.yml; this fills the
# gap that has bitten us: the macOS (.mcpb / no-Xcode) install depends on the
# darwin-arm64 N-API prebuilt loading AND on the inbound-SysEx receive
# path working, and the maintainer develops on Windows. This runs the
# virtual-loopback receive test on real macOS (Apple Silicon) and
# Linux runners, so a receive regression (e.g. ignoreTypes-before-openPort)
# is caught without anyone having to plug in hardware.
#
# NOTE (2026-07-10): the darwin-x64 (Intel, macos-13) leg was DROPPED because
# GitHub-hosted Intel macOS runners no longer schedule reliably (jobs queued
# ~24h, never picked up, dragging the whole run to a false failure). The
# darwin-arm64 leg exercises the identical @julusian N-API prebuilt load +
# receive path, and the darwin-x64 prebuilt is a stable N-API binary; Intel
# Macs are validated locally on the maintainer's iMac when needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  native:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14       # Apple Silicon (darwin-arm64) — the blind-user .mcpb target
            label: macos-arm64
          - os: ubuntu-latest  # linux-x64
            label: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # Linux needs the ALSA sequencer kernel module for RtMidi virtual
      # ports (openVirtualPort). It is not loaded by default on headless
      # CI images. macOS CoreMIDI needs nothing. No-op elsewhere.
      - name: Load ALSA virtual MIDI (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev alsa-utils || true
          # snd-virmidi creates a virtual sound card with MIDI ports AND the
          # ALSA sequencer (/dev/snd/seq), so RtMidi can initialise a client
          # and enumerate on a headless runner (the standard MIDI-CI approach).
          # snd-seq alone does not create /dev/snd/seq without a card.
          sudo modprobe snd-virmidi midi_devs=1 2>/dev/null \
            || sudo modprobe snd_virmidi midi_devs=1 2>/dev/null \
            || echo "snd-virmidi modprobe failed; MIDI-backed steps fall back to the graceful zero-port handling."
          if [ -e /dev/snd/seq ]; then echo "ALSA sequencer present (/dev/snd/seq); RtMidi can init + enumerate."; else echo "WARNING: no /dev/snd/seq; RtMidi cannot create a sequencer client on this runner."; fi

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Proves the N-API prebuilt loads + enumerates on this platform/arch
      # (the thing the macOS install win hinges on), independent of the
      # loopback test below.
      - name: Native bindings load + enumerate
        run: |
          node -e "const m=require('@julusian/midi'); console.log('@julusian/midi prebuilt loads on '+process.platform+'/'+process.arch); try { new m.Input().getPortCount(); new m.Output().getPortCount(); console.log('  MIDI enumerate ok'); } catch (e) { if (process.platform==='linux') { console.log('  MIDI enumerate skipped (no ALSA sequencer on this headless runner): '+e.message); } else { throw e; } }"
          node -e "import('serialport').then(m=>{if(!m.SerialPort)throw new Error('no SerialPort export');console.log('serialport loads on '+process.platform+'/'+process.arch);})"

      # Virtual-loopback SysEx round-trip: guards the inbound-SysEx receive
      # path (ignoreTypes-after-openPort) without hardware.
      - name: Virtual-loopback receive test
        run: npm run verify-loopback-midi

      - name: Test suite
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "Linux CI runner has no MIDI backend (no ALSA sequencer at /dev/snd/seq), so the server-smoke suite (which exercises real MIDI connections) cannot run here. It is covered on Windows (preflight) and macOS (this matrix). Running everything else on Linux."
            npm run test:no-server
          else
            npm test
          fi
