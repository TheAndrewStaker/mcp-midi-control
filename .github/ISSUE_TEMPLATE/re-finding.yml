name: Protocol reverse-engineering finding
description: You decoded something new about a supported device's MIDI protocol.
title: "[RE] "
labels: [reverse-engineering, documentation]
body:
  - type: markdown
    attributes:
      value: |
        Use this when you've decoded an envelope, action byte, parameter
        ID, or other protocol detail that isn't in the relevant per-device
        `SYSEX-MAP.md` yet. Even partial decodes are welcome: flag them
        with what's confirmed versus assumed.

        If you have raw evidence rather than a decode (a capture, a probe
        output, a file), use the **Hardware evidence** template instead.

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Fractal AM4
        - Fractal AX8
        - Fractal Axe-Fx Standard / Ultra
        - Fractal Axe-Fx II XL+
        - Fractal Axe-Fx III
        - Fractal FM3
        - Fractal FM9
        - Fractal VP4
        - ASM Hydrasynth
        - Arturia MicroFreak
        - Arturia MiniFreak
        - Novation Circuit Tracks
        - Roland SPD-SX
        - Boss VE-500
        - Boss RC-505mk2
        - Boss RC-600
        - Other
    validations:
      required: true

  - type: input
    id: subject
    attributes:
      label: What did you decode?
      placeholder: "AM4 function 0x01 action 0x3a = preset checksum response"
    validations:
      required: true

  - type: textarea
    id: bytes
    attributes:
      label: Wire bytes
      description: |
        Paste hex of the request + response. If it's a capture file,
        link to it.
      render: text
      placeholder: |
        Request:  F0 00 01 74 15 01 3A 00 ... F7
        Response: F0 00 01 74 15 01 3A 00 66 0F 0D 00 ... F7
    validations:
      required: true

  - type: textarea
    id: method
    attributes:
      label: How did you verify it?
      description: |
        Capture session ID, what you toggled on the device, what changed
        in the response, how many independent samples confirm.
    validations:
      required: true

  - type: dropdown
    id: confidence
    attributes:
      label: Evidence strength
      description: |
        This project ships STRONG-evidence decodes labelled untested, and
        keeps WEAK ones out or flags them distinctly. Being honest here is
        what keeps that line meaningful. See docs/contributing/EVIDENCE.md.
      options:
        - "STRONG: byte-exact against a real capture, self-validating against the device's own checksum, a byte-identical round-trip, or read byte for byte from a published spec"
        - "STRONG-ish: one capture supports it and nothing contradicts it, but there is no independent oracle"
        - "WEAK: a hypothesis with no way to catch a wrong answer"
    validations:
      required: true
